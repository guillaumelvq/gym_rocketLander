[project]
name = "gym-rocketlander"
version = "0.17.2"
description = "Fork of OpenAI Gym 0.17 with the RocketLander-v0 Box2D environment (tunable difficulty)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "six>=1.16",
    "cloudpickle>=2.0",
    # gym 0.17's rendering.py uses legacy OpenGL: pyglet 2.x breaks it.
    "pyglet>=1.5.27,<2",
    # pybox2d (import name: Box2D). Prebuilt Windows wheels, no SWIG needed.
    "box2d>=2.3.10",
]

[dependency-groups]
rl = [
    "torch>=2.4",
    "stable-baselines3>=2.4",
    "gymnasium>=1.0",
    "tensorboard>=2.17",
    "tqdm",
    "rich",
]
dev = ["pytest>=8", "mock"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gym*"]

[tool.setuptools.package-data]
gym = ["envs/classic_control/assets/*.png", "envs/mujoco/assets/*.xml"]

[tool.uv]
default-groups = ["dev", "rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
